name: 每日报告部署

on:
  schedule:
    - cron: '50 14 * * *'   # UTC 14:50 = 北京 22:50（等净值入库，且晚于 22:07/22:37 的止损推送）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: 安装依赖
        run: pip install --quiet -r automation/requirements.txt

      - name: 抓取最新净值
        working-directory: automation
        env:
          TZ: Asia/Shanghai
        run: python 基金数据获取.py

      - name: 重算止损回测
        working-directory: automation
        env:
          TZ: Asia/Shanghai
        run: python 止损回测.py

      - name: 刷新数据（锁定本月目标权重）
        working-directory: automation
        env:
          TZ: Asia/Shanghai
        run: python 更新测算.py --freeze-weights

      - name: 生成报告
        working-directory: automation
        env:
          TOTAL_ASSET: ${{ secrets.TOTAL_ASSET }}
          TZ: Asia/Shanghai
        run: python 生成报告.py

      - name: 生成站点
        working-directory: automation
        env:
          TZ: Asia/Shanghai
        run: python 生成网站.py

      - name: 发布到 Pages 根目录
        run: |
          cp -f automation/site/index.html ./index.html
          cp -f automation/site/report.html ./report.html
          mkdir -p assets
          cp -f automation/site/assets/data.js assets/data.js
          if [ ! -f assets/echarts.min.js ]; then cp -f automation/site/assets/echarts.min.js assets/echarts.min.js; fi

      - name: 清理历史净值快照
        run: ls -1t automation/每日基金净值_自动_*.xlsx | tail -n +2 | xargs -r rm -f

      - name: 回写数据与心跳
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html report.html assets/data.js 2>/dev/null || true
          if [ -f assets/echarts.min.js ]; then git add assets/echarts.min.js; fi
          git add -u automation 2>/dev/null || true
          date -u +"%Y-%m-%d %H:%M UTC" > automation/last_report_run.txt
          git add automation/last_report_run.txt automation/本月目标权重.json 2>/dev/null || true
          git add automation/每日基金净值_自动_*.xlsx 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 每日报告 $(TZ=Asia/Shanghai date +%F)"
          fi
          git pull --rebase --autostash origin main
          git push
