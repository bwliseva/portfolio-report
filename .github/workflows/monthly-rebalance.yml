name: 月度调仓提醒

on:
  schedule:
    - cron: '0 1 1 * *'   # UTC 01:00 每月 1 日 = 北京时间 09:00 每月 1 日
  workflow_dispatch:
    inputs:
      force:
        description: '强制运行（忽略非 1 日与本月已提醒标记）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: 安装依赖
        run: pip install --quiet -r automation/requirements.txt

      - name: 月度调仓提醒
        working-directory: automation
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TOTAL_ASSET: ${{ secrets.TOTAL_ASSET }}
          TZ: Asia/Shanghai
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            ARGS="--force"
          fi
          python 月度调仓提醒.py $ARGS

      - name: 回写状态与数据
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/调仓提醒状态.json 2>/dev/null || true
          git add automation/止损监控状态.json 2>/dev/null || true
          git add automation/投资组合分析明细.xlsx 2>/dev/null || true
          git add automation/每日基金净值_自动_*.xlsx 2>/dev/null || true
          date -u +"%Y-%m-%d %H:%M UTC" > automation/last_monthly_run.txt
          git add automation/last_monthly_run.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 月度调仓 $(TZ=Asia/Shanghai date +%F)"
          fi
          git pull --rebase --autostash origin main
          git push
