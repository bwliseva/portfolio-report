name: 每日止损推送

on:
  schedule:
    - cron: '0 14 * * *'   # UTC 14:00 = 北京时间 22:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stop
  cancel-in-progress: false

jobs:
  push-card:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: 安装依赖
        run: pip install --quiet -r automation/requirements.txt

      - name: 运行每日止损监控
        working-directory: automation
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TOTAL_ASSET: ${{ secrets.TOTAL_ASSET }}
          TZ: Asia/Shanghai
        run: python 每日止损监控.py

      - name: 回写状态与心跳
        if: always()
        run: |
          mkdir -p automation
          date -u +"%Y-%m-%d %H:%M UTC" > automation/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/止损监控状态.json automation/last_run.txt
          if [ -f automation/止损监控日志.csv ]; then git add automation/止损监控日志.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新止损状态 $(TZ=Asia/Shanghai date +%F)"
          fi
          git pull --rebase --autostash origin main
          git push
