name: 每日止损推送

on:
  schedule:
    - cron: '7 14 * * *'    # UTC 14:07 = 北京 22:07（避开整点高负载，整点任务易被延迟或丢弃）
    - cron: '37 14 * * *'   # UTC 14:37 = 北京 22:37（兜底；当天已推送则自动跳过）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stop
  cancel-in-progress: false

jobs:
  push-card:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: 安装依赖
        run: pip install --quiet -r automation/requirements.txt

      - name: 检查今日是否已推送
        id: check
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "手动触发，强制执行"
          elif [ -f automation/last_push_date.txt ] && [ "$(cat automation/last_push_date.txt)" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "今日（$TODAY）已推送，跳过本次兜底触发"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 运行每日止损监控
        if: steps.check.outputs.skip != 'true'
        working-directory: automation
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TOTAL_ASSET: ${{ secrets.TOTAL_ASSET }}
          TZ: Asia/Shanghai
        run: python 每日止损监控.py

      - name: 记录推送日期
        if: steps.check.outputs.skip != 'true'
        run: TZ=Asia/Shanghai date +%F > automation/last_push_date.txt

      - name: 回写状态与心跳
        if: always()
        run: |
          mkdir -p automation
          date -u +"%Y-%m-%d %H:%M UTC" > automation/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/止损监控状态.json automation/last_run.txt
          if [ -f automation/last_push_date.txt ]; then git add automation/last_push_date.txt; fi
          if [ -f automation/止损监控日志.csv ]; then git add automation/止损监控日志.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新止损状态 $(TZ=Asia/Shanghai date +%F)"
          fi
          git pull --rebase --autostash origin main
          git push
