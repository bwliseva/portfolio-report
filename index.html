<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>组合投资实时看板</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1b2330; --muted:#6b7684;
    --line:#e6eaf0; --accent:#2563eb; --up:#c0392b; --down:#1e8449;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 18px}
  h1{font-size:22px;margin:0;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;background:#eef3ff;color:#2563eb;font-size:12px;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .kpi .lab{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .val{font-size:25px;font-weight:700;margin-top:7px;font-variant-numeric:tabular-nums}
  .kpi .ex{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .val.pos{color:var(--up)} .kpi .val.neg{color:var(--down)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
        box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 4px;font-weight:700}
  .card .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
  .seg{display:inline-flex;background:#f1f4f8;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-size:12px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;
        font-size:12px;color:var(--muted);cursor:pointer;background:#fff;user-select:none;transition:.15s}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
  .chip.on{color:var(--ink);border-color:#c9d6ee;background:#f7faff;font-weight:600}
  .chip.off{opacity:.5}
  #mainChart{width:100%;height:460px}
  .legend-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px;background:#fafcff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .tag.ok{background:#e8f6ee;color:#1e8449}
  .tag.off{background:#fdecea;color:#c0392b}
  .tag.na{background:#eef1f5;color:#6b7684}
  tr.total td{font-weight:700;background:#fafcff;border-top:2px solid #dfe6ef;border-bottom:0}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .entry{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
       padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600}
  .btn:hover{filter:brightness(1.05)}
  footer{color:var(--muted);font-size:12px;line-height:1.8;padding:8px 2px}
  @media (max-width:860px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi:last-child{grid-column:1/-1}
    #mainChart{height:380px}
    h1{font-size:18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>组合投资实时看板</h1>
      <div class="sub" id="subtitle">加载中…</div>
    </div>
    <div><span class="pill" id="asof">—</span></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>累计收益率对比</h2>
    <div class="toolbar">
      <div class="seg" id="rangeSeg">
        <button data-r="ytd" class="on">今年以来</button>
        <button data-r="3m">近三个月</button>
        <button data-r="1m">近一个月</button>
      </div>
    </div>
    <div class="chips" id="comboChips"></div>
    <div class="chips" id="indexChips"></div>
    <div id="mainChart"></div>
    <div class="legend-note" id="chartNote"></div>
  </section>

  <section class="card">
    <h2>当前持仓与止损状态</h2>
    <p class="hint">数据日：<span id="holdAsOf">—</span>　·　每日更新</p>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>基金</th><th class="num">MV 权重</th>
          <th class="num">持仓市值</th><th class="num">份额</th><th class="num">自高点回撤</th><th>状态</th>
        </tr></thead>
        <tbody id="holdBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card entry">
    <div>
      <h2>完整月度报告</h2>
      <p class="hint" style="margin:0">包含资产池、两模型权重与回测、相关系数矩阵、单基金止损执行手册与附录。</p>
    </div>
    <a class="btn" href="report.html">打开报告 →</a>
  </section>

  <footer id="foot"></footer>
</div>

<script src="assets/echarts.min.js"></script>
<script src="assets/data.js?v=202611122329"></script>
<script>
(function () {
  var D = window.SITE;
  if (!D) { document.getElementById('subtitle').textContent = '数据未生成'; return; }

  var C = {
    mv_stop: '#c0392b', mv: '#e67e22', real_stop: '#1f6feb', real: '#2aa198',
    rp: '#8e44ad'
  };
  var NAME = {
    mv_stop: 'MV（月调+日止损）', mv: 'MV（月调·不止损）',
    real_stop: '真实持仓 + 分批止损', real: '真实持仓（不止损）',
    rp: 'RP（月调）'
  };
  var IDX_COLOR = ['#95a5a6', '#7f8c8d', '#bdc3c7', '#a6b1e1', '#d5b8a5', '#9bb7b0', '#c7b8c9', '#b9c0a0'];

  var state = { range: 'ytd', on: { mv_stop: 1, mv: 1, real_stop: 1, real: 1, rp: 1 }, idx: {} };
  var d0 = D.dates[0], n = D.dates.length;

  function startIdx(r) {
    if (r === 'ytd') return 0;
    var end = new Date(D.dates[n - 1]);
    var back = new Date(end);
    if (r === '3m') back.setMonth(back.getMonth() - 3); else back.setMonth(back.getMonth() - 1);
    for (var i = 0; i < n; i++) if (new Date(D.dates[i]) >= back) return i;
    return 0;
  }
  function pct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
  function cls(v) { return v >= 0 ? 'pos' : 'neg'; }

  // ---------- KPI ----------
  var kpis = [
    ['mv_stop', 'MV（月调+日止损）', C.mv_stop],
    ['mv', 'MV（月调·不止损）', C.mv],
    ['real_stop', '真实持仓 + 分批止损', C.real_stop],
    ['real', '真实持仓（不止损）', C.real],
    ['rp', 'RP（月调）', C.rp]
  ];
  document.getElementById('kpis').innerHTML = kpis.map(function (k) {
    var v = D.kpi[k[0]];
    var ex = D.kpi[k[0] + '_ex'];
    return '<div class="kpi"><div class="lab" style="color:' + k[2] + '">' + k[1] + '</div>'
      + '<div class="val ' + cls(v) + '">' + pct(v) + '</div>'
      + '<div class="ex">' + (ex === null || ex === undefined ? '' : '较沪深300 ' + pct(ex)) + '</div></div>';
  }).join('');

  document.getElementById('asof').textContent = '数据日 ' + D.asof;
  var holdAsOf = document.getElementById('holdAsOf');
  if (holdAsOf) holdAsOf.textContent = D.asof;
  document.getElementById('subtitle').textContent = D.subtitle;

  // ---------- chips ----------
  var comboChips = document.getElementById('comboChips');
  comboChips.innerHTML = Object.keys(NAME).map(function (k) {
    return '<span class="chip on" data-k="' + k + '" style="color:' + C[k] + '"><i class="dot"></i>' + NAME[k] + '</span>';
  }).join('');

  var idxChips = document.getElementById('indexChips');
  idxChips.innerHTML = D.indexes.map(function (x, i) {
    var on = D.defaultIndexes.indexOf(x.name) >= 0;
    state.idx[x.name] = on ? 1 : 0;
    return '<span class="chip ' + (on ? 'on' : 'off') + '" data-i="' + i + '" style="color:' + IDX_COLOR[i % IDX_COLOR.length] + '"><i class="dot"></i>' + x.name + '</span>';
  }).join('');

  comboChips.addEventListener('click', function (e) {
    var el = e.target.closest('.chip'); if (!el) return;
    var k = el.getAttribute('data-k'); state.on[k] = state.on[k] ? 0 : 1;
    el.className = 'chip ' + (state.on[k] ? 'on' : 'off'); draw();
  });
  idxChips.addEventListener('click', function (e) {
    var el = e.target.closest('.chip'); if (!el) return;
    var i = +el.getAttribute('data-i'), nm = D.indexes[i].name;
    state.idx[nm] = state.idx[nm] ? 0 : 1;
    el.className = 'chip ' + (state.idx[nm] ? 'on' : 'off'); draw();
  });
  document.querySelectorAll('#rangeSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#rangeSeg button').forEach(function (x) { x.className = ''; });
      b.className = 'on'; state.range = b.getAttribute('data-r'); draw();
    });
  });

  // ---------- chart ----------
  var chart = echarts.init(document.getElementById('mainChart'));
  window.addEventListener('resize', function () { chart.resize(); });

  function slice(arr, s) { return arr.slice(s); }

  function draw() {
    var s = startIdx(state.range);
    var dates = slice(D.dates, s);
    var series = [];
    Object.keys(NAME).forEach(function (k) {
      if (!state.on[k]) return;
      series.push({
        name: NAME[k], type: 'line', smooth: true, symbol: 'none',
        lineStyle: { width: 2.4, color: C[k] }, itemStyle: { color: C[k] },
        emphasis: { focus: 'series' },
        data: slice(D.series[k], s)
      });
    });
    D.indexes.forEach(function (x, i) {
      if (!state.idx[x.name]) return;
      series.push({
        name: x.name, type: 'line', smooth: true, symbol: 'none',
        lineStyle: { width: 1.4, color: IDX_COLOR[i % IDX_COLOR.length], type: 'dashed' },
        itemStyle: { color: IDX_COLOR[i % IDX_COLOR.length] },
        emphasis: { focus: 'series' },
        data: slice(x.values, s)
      });
    });
    chart.setOption({
      animationDuration: 400,
      grid: { left: 52, right: 18, top: 20, bottom: 56 },
      tooltip: {
        trigger: 'axis',
        valueFormatter: function (v) { return (v === null || v === undefined) ? '—' : pct(v); },
        axisPointer: { type: 'cross' }
      },
      legend: {
        type: 'scroll', bottom: 0, itemWidth: 18, itemHeight: 8,
        textStyle: { fontSize: 12, color: '#4a5568' }
      },
      xAxis: {
        type: 'category', data: dates, boundaryGap: false,
        axisLine: { lineStyle: { color: '#e6eaf0' } },
        axisLabel: { color: '#8b95a3', fontSize: 11 },
        axisTick: { show: false }
      },
      yAxis: {
        type: 'value', scale: true,
        axisLabel: { formatter: '{value}%', color: '#8b95a3', fontSize: 11 },
        splitLine: { lineStyle: { color: '#eef2f7' } }
      },
      series: series
    }, true);

    var note = '区间：' + dates[0] + ' ~ ' + dates[dates.length - 1] + '（起点 0%）　共 ' + dates.length + ' 个交易日';
    document.getElementById('chartNote').textContent = note;
  }

  // ---------- holdings ----------
  var body = document.getElementById('holdBody');
  var S = D.holdSummary || { w_mv: '—', value: '—', count: D.holdings.length };
  body.innerHTML = D.holdings.map(function (h) {
    var st, pos = (h.pos === undefined || h.pos === null) ? 1 : h.pos;
    if (h.kind !== 'fund') {
      st = '<span class="tag na">不监控</span>';
    } else if (pos >= 1) {
      st = '<span class="tag ok">持有</span>';
    } else if (pos > 0) {
      st = '<span class="tag na">半仓</span>';
    } else {
      st = '<span class="tag off">已清仓</span>';
    }
    return '<tr>'
      + '<td>' + h.name + '</td>'
      + '<td class="num">' + h.w_mv + '</td>'
      + '<td class="num">' + h.value + '</td>'
      + '<td class="num">' + h.shares + '</td>'
      + '<td class="num" style="color:' + (h.dd_num <= -15 ? '#c0392b' : h.dd_num <= -10 ? '#e67e22' : '#4a5568') + '">' + h.dd + '</td>'
      + '<td>' + st + '</td>'
      + '</tr>';
  }).join('')
    + '<tr class="total">'
      + '<td>合计（' + S.count + ' 项）</td>'
      + '<td class="num">' + S.w_mv + '</td>'
      + '<td class="num">' + S.value + '</td>'
      + '<td class="num">—</td>'
      + '<td class="num">—</td>'
      + '<td>—</td>'
    + '</tr>';

  document.getElementById('foot').innerHTML =
    '更新时间 ' + D.updated + '　·　净值数据日 ' + D.asof + '　·　指数数据日 ' + D.indexAsOf
    + '<br>' + D.note;

  draw();
})();
</script>
</body>
</html>
